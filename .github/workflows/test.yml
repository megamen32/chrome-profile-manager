name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime dependency
        run: python -m pip install --require-hashes -r chrome_profile_manager_requirements.txt
      - name: Install test runner
        run: python -m pip install pytest==8.3.5
      - name: Run standalone tests
        run: python -m pytest
